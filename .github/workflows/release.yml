name: Build and publish Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate version tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 35
        run: "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \"platforms;android-35\" \"build-tools;35.0.0\""

      - name: Test and build APK
        run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "electrical-knowledge-${RELEASE_TAG}-debug.apk"
          sha256sum "electrical-knowledge-${RELEASE_TAG}-debug.apk" > SHA256SUMS.txt

      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: app/build/reports/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 电气知识卡片 ${{ env.RELEASE_TAG }}
          body_path: docs/release-v2.0.0.md
          files: |
            electrical-knowledge-${{ env.RELEASE_TAG }}-debug.apk
            docs/knowledge-template.csv
            SHA256SUMS.txt
            app/build/reports/widget-preview-360x400.png
